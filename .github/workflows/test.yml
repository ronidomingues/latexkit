name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Testes unitarios (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.10 e o minimo declarado em engines.node, e e onde APIs recentes
        # do Node quebram primeiro: util.styleText, por exemplo, so existe a
        # partir do 20.12. Testar o minimo evita publicar algo que nao roda na
        # versao que o proprio pacote promete suportar.
        node: ['20.10', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run test:unit

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck

  integration:
    name: Compilacao dos templates
    runs-on: ubuntu-latest
    # A imagem traz TeX Live completo (abntex2, beamer, biblatex-abnt, biber),
    # o que evita instalar pacotes a cada execucao e mantem o resultado igual
    # ao que os usuarios obtem com --engine=docker.
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Compilar todos os templates
        run: npm run test:integration
